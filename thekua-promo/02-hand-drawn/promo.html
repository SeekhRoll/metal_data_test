<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Thekua Promo — Hand-drawn</title>
<style>
  @font-face { font-family: Baloo; src: url(../fonts/Baloo2.ttf); font-weight: 400 800; }
  @font-face { font-family: Kalam; src: url(../fonts/Kalam-Bold.ttf); }
  @font-face { font-family: Patrick; src: url(../fonts/PatrickHand-Regular.ttf); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 360px; height: 640px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================ EDIT ME
const BRAND = 'Sri Desi Thekua';
const PHONE = '+91 81782 26605';
const AREA  = 'Dwarka, New Delhi';
// ============================================================

const W = 1080, H = 1920, CX = W / 2;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');   // swapped briefly when a character is drawn offscreen
const INK = '#3d2618';

// ---------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const eInCubic = k => k * k * k;
const bounceOut = k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; };
const pop = (t, a, d = .35) => eOutBack(seg(t, a, a + d));
const hopAt = t => { const k = ((t % .5) + .5) % .5 / .5; return 4 * k * (1 - k); };   // one hop per beat
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b) { let h = Math.imul((a | 0) * 374761393 + (b | 0) * 668265263, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function mixHex(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- line boil: outlines re-jitter 8x per second, like redrawn animation frames
let BOIL = 0, T = 0;
const jit = (i, amp = 2) => (hash(i, BOIL) - .5) * 2 * amp;

// ============================================================ SKETCH PRIMITIVES
function ellPts(cx, cy, rx, ry, seed = 1, o = {}) {
  const n = o.n || 30, pts = [], wob = o.wob ?? 2.4;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + (o.a0 || 0), r = 1 + (o.bAmp || 0) * Math.sin(a * (o.bumps || 0));
    pts.push([cx + Math.cos(a) * rx * r + jit(seed * 131 + i, wob), cy + Math.sin(a) * ry * r + jit(seed * 131 + i + 999, wob)]);
  }
  return pts;
}
// rounded rectangle via superellipse
function boxPts(cx, cy, w, h, seed = 1, p = 5, n = 40) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    pts.push([cx + Math.sign(c) * Math.pow(Math.abs(c), 2 / p) * w / 2 + jit(seed * 71 + i, 2.2), cy + Math.sign(s) * Math.pow(Math.abs(s), 2 / p) * h / 2 + jit(seed * 71 + i + 500, 2.2)]);
  }
  return pts;
}
function poly(verts, seed = 1, per = 6) {
  const pts = [];
  verts.forEach((v, i) => { const w = verts[(i + 1) % verts.length]; for (let k = 0; k < per; k++) { const f = k / per; pts.push([lerp(v[0], w[0], f) + jit(seed * 37 + i * per + k, 1.6), lerp(v[1], w[1], f) + jit(seed * 37 + i * per + k + 777, 1.6)]); } });
  return pts;
}
function closed(pts) {
  ctx.beginPath(); const n = pts.length, m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const s = m(pts[n - 1], pts[0]); ctx.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = m(p, pts[(i + 1) % n]); ctx.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  ctx.closePath();
}
function open(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) { const p = pts[i], q = pts[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  const l = pts[pts.length - 1]; ctx.lineTo(l[0], l[1]);
}
// fill with crayon grain, then an ink outline
function ink(pts, fill, lw = 6, o = {}) {
  closed(pts);
  if (fill) {
    ctx.fillStyle = fill; ctx.fill();
    if (o.tex !== false) { ctx.save(); ctx.globalAlpha *= .22; ctx.fillStyle = A.crayon; ctx.fill(); ctx.restore(); }
  }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = o.stroke || INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
function line(pts, lw = 6, color = INK, seed = 3) {
  const p = pts.map(([x, y], i) => [x + jit(seed * 53 + i, 1.8), y + jit(seed * 53 + i + 300, 1.8)]);
  open(p); ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function dot(x, y, r, color) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = color; ctx.fill(); }
function shine(x, y, r, a0 = 3.6, a1 = 4.4, lw = 7) { ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); }

function heart(x, y, s, color = '#ff7a8a', rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot + jit(x | 0, .04)); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.bezierCurveTo(-60, -10, -30, -55, 0, -22); ctx.bezierCurveTo(30, -55, 60, -10, 0, 30); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  shine(-16, -18, 10, 3.4, 4.4, 4);
  ctx.restore();
}
function sparkle(x, y, s, color = '#ffd24a') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(jit(x | 0, .1));
  ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 12 : 40, a = i / 8 * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}
function burstStars(seed, x, y, age, n = 10, dist = 260) {
  if (age < 0 || age > .8) return;
  const R = mulberry(seed), cols = ['#ffd24a', '#ff9aa2', '#8fd3ff', '#9be29b', '#ffb23f'];
  for (let i = 0; i < n; i++) {
    const a = R() * 7, d = dist * (.5 + R() * .6) * eOutCubic(age / .8), s = (.4 + R() * .5) * (1 - age / .8);
    if (R() < .4) heart(x + Math.cos(a) * d, y + Math.sin(a) * d, s * .7, cols[i % 5]); else sparkle(x + Math.cos(a) * d, y + Math.sin(a) * d, s, cols[i % 5]);
  }
}
function floatHearts(t, seed, x0, x1, y0, n = 8, rise = 500) {
  const R = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const cyc = 2 + R() * 1.5, ph = R() * cyc, k = ((t + ph) % cyc) / cyc;
    const x = lerp(x0, x1, R()) + Math.sin(t * 2 + i) * 20, y = y0 - k * rise;
    const s = (.35 + R() * .3) * Math.sin(k * Math.PI);
    if (s > .02) heart(x, y, s, ['#ff7a8a', '#ff9aa2', '#ffb3c1'][i % 3]);
  }
}

// ---------- faces
function face(x, y, s, mood = 'happy', seed = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const blink = ((T + seed * .73) % 2.7) < .12;
  ctx.fillStyle = 'rgba(255,120,140,.5)';
  ctx.beginPath(); ctx.ellipse(-50, 16, 17, 10, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(50, 16, 17, 10, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const eye = (ex, kind) => {
    if (kind === 'open') {
      ctx.beginPath(); ctx.ellipse(ex, -8, 10, 13, 0, 0, 7); ctx.fillStyle = INK; ctx.fill();
      dot(ex + 3.5, -13, 4, '#fff'); dot(ex - 3, -3, 2, '#fff');
    } else if (kind === 'arc') { ctx.beginPath(); ctx.arc(ex, -2, 11, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (kind === 'relax') { ctx.beginPath(); ctx.arc(ex, -12, 11, Math.PI * .15, Math.PI * .85); ctx.stroke(); }
    else if (kind === 'gt') { const d = ex < 0 ? 1 : -1; ctx.beginPath(); ctx.moveTo(ex - 10 * d, -18); ctx.lineTo(ex + 8 * d, -8); ctx.lineTo(ex - 10 * d, 2); ctx.stroke(); }
    else if (kind === 'star') { ctx.save(); ctx.translate(ex, -8); sparkle(0, 0, .45, '#ffd24a'); ctx.restore(); }
  };
  const E = { happy: ['open', 'open'], wink: ['open', 'arc'], relax: ['relax', 'relax'], squish: ['gt', 'gt'], joy: ['arc', 'arc'], wow: ['star', 'star'] }[mood] || ['open', 'open'];
  eye(-28, blink && E[0] === 'open' ? 'arc' : E[0]); eye(28, blink && E[1] === 'open' ? 'arc' : E[1]);
  if (mood === 'squish') { ctx.beginPath(); ctx.moveTo(-14, 18); for (let i = 0; i < 4; i++) ctx.lineTo(-14 + (i + 1) * 7, 18 + (i % 2 ? -5 : 5)); ctx.stroke(); }
  else if (mood === 'wow' || mood === 'joy') {
    ctx.beginPath(); ctx.moveTo(-16, 10); ctx.quadraticCurveTo(0, 42, 16, 10); ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 24, 7, 5, 0, 0, 7); ctx.fillStyle = '#ff7a8a'; ctx.fill();
  } else { ctx.beginPath(); ctx.arc(0, 8, 12, Math.PI * .15, Math.PI * .85); ctx.stroke(); }
  ctx.restore();
}

// ============================================================ CHARACTERS (drawn around 0,0)
const DOUGH = '#f8e8c6', GOLD = '#f2aa48';
function thekua(o = {}) {
  const done = o.done ?? 1, seed = o.seed || 1, col = mixHex(DOUGH, GOLD, done), ridge = `rgba(${lerp(190, 170, done)},${lerp(150, 90, done)},${lerp(100, 30, done)},.75)`;
  if (o.arms) {
    for (const s of [-1, 1]) {
      const wv = o.wave && s === 1 ? Math.sin(T * 12) * 30 : Math.sin(T * 4 + s) * 6;
      line([[s * 130, 10], [s * 175, -10 + wv * .5], [s * 205, -40 + wv]], 7, INK, seed + s);
      ink(ellPts(s * 210, -46 + wv, 20, 20, seed + 5 + s, { n: 10 }), col, 5);
    }
  }
  if (o.legs) for (const s of [-1, 1]) ink(ellPts(s * 55, 118, 26, 20, seed + 9 + s, { n: 12 }), mixHex('#e9cf9f', '#d98a35', done), 5);
  const body = ellPts(0, 0, 165, 128, seed, { n: 48, bumps: 22, bAmp: .035, wob: 1.8 });
  ink(body, col, 7);
  ctx.save(); closed(body); ctx.clip();
  // mould ridges round the rim, face stays clear
  for (let i = 0; i < 17; i++) {
    const a = Math.PI + i / 16 * Math.PI, ex = Math.cos(a) * 170, ey = Math.sin(a) * 132;
    line([[ex, ey], [ex * .62, ey * .55 + 20]], 6, ridge, seed * 7 + i);
  }
  for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; dot(Math.cos(a) * 140, Math.sin(a) * 106, 4.5, ridge); }
  const R = mulberry(seed);
  for (let i = 0; i < 9; i++) { ctx.save(); ctx.translate((R() - .5) * 220, (R() - .2) * 140); ctx.rotate(R() * 7); ctx.beginPath(); ctx.ellipse(0, 0, 8, 3, 0, 0, 7); ctx.fillStyle = 'rgba(120,120,40,.7)'; ctx.fill(); ctx.restore(); }
  ctx.restore();
  closed(body); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
  shine(-40, -30, 90, 3.7, 4.3, 8);
  if (!o.noFace) face(0, 20, 1, o.mood || 'happy', seed);
}

function doughBall(o = {}) {
  ink(ellPts(0, 0, 150, 140, o.seed || 4, { n: 30 }), DOUGH, 7);
  shine(-30, -30, 90, 3.7, 4.4, 8);
  const R = mulberry(3); for (let i = 0; i < 7; i++) { ctx.save(); ctx.translate((R() - .5) * 200, (R() - .5) * 180); ctx.rotate(R() * 7); ctx.beginPath(); ctx.ellipse(0, 0, 8, 3, 0, 0, 7); ctx.fillStyle = 'rgba(120,120,40,.6)'; ctx.fill(); ctx.restore(); }
  face(0, 15, 1, o.mood || 'happy', 4);
}

function attaSack() {
  ink(boxPts(0, 20, 300, 320, 11, 3.2), '#f6e8cf', 7);
  ink(ellPts(0, -160, 80, 42, 12, { n: 16 }), '#f6e8cf', 7);
  line([[-60, -128], [0, -118], [60, -128]], 9, '#c98b4a', 13);
  ctx.save(); ctx.font = '700 64px Kalam'; ctx.textAlign = 'center'; ctx.fillStyle = '#c98b4a'; ctx.fillText('आटा', 0, 135); ctx.restore();
  shine(-60, -10, 110, 3.5, 4.1, 8);
  face(0, 10, 1, 'happy', 11);
}
function gudCube() {
  ink(poly([[-140, -80], [0, -150], [140, -80], [140, 110], [0, 170], [-140, 110]], 40), '#c9763a', 7);
  ink(poly([[-140, -80], [0, -150], [140, -80], [0, -20]], 41), '#e39a58', 6);
  line([[0, -20], [0, 170]], 6, INK, 42);
  const R = mulberry(5); for (let i = 0; i < 12; i++) dot((R() - .5) * 220, 20 + (R() - .5) * 180, 3 + R() * 3, 'rgba(255,230,180,.8)');
  face(-70, 55, .75, 'joy', 21);
}
function gheeKatori() {
  ink(ellPts(0, 0, 190, 120, 31, { n: 30, a0: 0 }).map(([x, y]) => [x, Math.max(y, -20 + jit(x | 0, 1))]), '#f4c95d', 7);
  ink(ellPts(0, -20, 190, 50, 32, { n: 30 }), '#ffe27a', 7);
  shine(-60, -30, 60, 3.6, 4.4, 7);
  // drop above
  const dy = -170 + Math.sin(T * 5) * 12;
  ctx.beginPath(); ctx.moveTo(0, dy - 60); ctx.quadraticCurveTo(38, dy, 0, dy + 34); ctx.quadraticCurveTo(-38, dy, 0, dy - 60); ctx.fillStyle = '#ffd84d'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  dot(-10, dy + 2, 6, '#fff');
  face(0, 45, .9, 'happy', 31);
}
function coconut() {
  ink(ellPts(0, 0, 160, 150, 41, { n: 30 }), '#8b5a34', 7);
  const R = mulberry(41);
  for (let i = 0; i < 26; i++) { const a = R() * 7, d = 60 + R() * 80; line([[Math.cos(a) * d, Math.sin(a) * d], [Math.cos(a + .15) * (d + 22), Math.sin(a + .15) * (d + 22)]], 4, '#c08a5c', 400 + i); }
  for (const [x, y] of [[-18, -108], [18, -108], [0, -84]]) dot(x, y, 9, '#4a2a14');
  ctx.save(); ctx.scale(1, 1); ctx.fillStyle = '#fff4e0'; ctx.beginPath(); ctx.ellipse(0, 25, 92, 64, 0, 0, 7); ctx.fill(); ctx.restore();
  face(0, 22, .95, 'happy', 41);
}
function elaichi() {
  ctx.save(); ctx.rotate(-.12);
  ink(ellPts(0, 0, 175, 105, 51, { n: 30, bumps: 2, bAmp: .06 }), '#9ccb6b', 7);
  line([[-150, -30], [-60, -62], [60, -62], [150, -30]], 4, 'rgba(60,90,30,.6)', 52);
  shine(-40, -20, 90, 3.8, 4.4, 7);
  face(0, 28, .9, 'wink', 51);
  ctx.restore();
  // tiny saunf buddies orbiting
  for (let i = 0; i < 3; i++) {
    const a = T * 2.4 + i * 2.1, x = Math.cos(a) * 250, y = Math.sin(a) * 90 - 40 - hopAt(T + i * .17) * 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(a) * .5);
    ink(ellPts(0, 0, 38, 16, 60 + i, { n: 12, wob: 1 }), '#c5c268', 4);
    dot(-8, -2, 3.5, INK); dot(8, -2, 3.5, INK);
    ctx.restore();
  }
}
const FRIENDS = [attaSack, gudCube, gheeKatori, coconut, elaichi];

function chaiCup() {
  for (let i = 0; i < 3; i++) { const x = -40 + i * 40; line(Array.from({ length: 6 }, (_, k) => [x + Math.sin(T * 4 + k + i) * 12, -150 - k * 24]), 5, 'rgba(61,38,24,.45)', 70 + i); }
  ctx.beginPath(); ctx.arc(120, 0, 44, -1.2, 1.2); ctx.lineWidth = 16; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 8; ctx.strokeStyle = '#8fd3ff'; ctx.stroke();
  ink(poly([[-120, -110], [120, -110], [100, 110], [-100, 110]], 7), '#8fd3ff', 7);
  ink(ellPts(0, -110, 120, 26, 77, { n: 20 }), '#c98b4a', 6);
  shine(-40, -10, 70, 3.8, 4.3, 7);
  face(0, 10, .85, 'joy', 77);
}

function diya(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const fl = Math.sin(T * 14) * 5;
  ctx.beginPath(); ctx.moveTo(-18, -50); ctx.quadraticCurveTo(-24, -100, fl, -140); ctx.quadraticCurveTo(24, -100, 18, -50); ctx.quadraticCurveTo(0, -38, -18, -50);
  ctx.fillStyle = '#ffb23f'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -75, 8, 16, 0, 0, 7); ctx.fillStyle = '#fff3a0'; ctx.fill();
  ink(poly([[-110, -40], [110, -40], [70, 30], [-70, 30]], x | 0), '#e0754a', 6);
  dot(-40, -10, 6, '#ffd24a'); dot(0, -6, 6, '#ffd24a'); dot(40, -10, 6, '#ffd24a');
  ctx.restore();
}

function marigold(x, y, s, seed) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ink(ellPts(0, 0, 50, 50, seed, { n: 24, bumps: 12, bAmp: .12 }), seed % 2 ? '#ff8a3d' : '#ffb23f', 5);
  ink(ellPts(0, 0, 26, 26, seed + 3, { n: 14, bumps: 8, bAmp: .15 }), seed % 2 ? '#ff6f2e' : '#ff9a2e', 4, { tex: false });
  ctx.restore();
}

// ============================================================ TEXT
function sticker(str, x, y, size, fill, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate((o.rot || 0) + jit((o.seed || 7) * 3, .012));
  const s = o.scale ?? 1; ctx.scale(s, s);
  ctx.font = `${o.weight || 800} ${size}px Baloo`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const th = o.thin ? .45 : 1;
  ctx.lineWidth = size * .30 * (o.thin ? .7 : 1); ctx.strokeStyle = o.halo || '#fffaf0'; ctx.strokeText(str, 0, 0);
  ctx.fillStyle = INK; ctx.lineWidth = size * .09 * th; ctx.strokeStyle = INK;
  ctx.fillText(str, size * .04 * th, size * .055 * th); ctx.strokeText(str, size * .04 * th, size * .055 * th);
  ctx.fillStyle = fill; ctx.fillText(str, 0, 0);
  ctx.lineWidth = size * .065 * th; ctx.strokeText(str, 0, 0); ctx.fillText(str, 0, 0);
  ctx.restore();
}
function hand(str, x, y, size, color = INK, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate((o.rot || 0) + jit((o.seed || 5) * 7, .01)); ctx.scale(o.scale ?? 1, o.scale ?? 1);
  ctx.font = `${o.weight || ''} ${size}px ${o.fam || 'Patrick'}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (o.halo) { ctx.lineWidth = size * .22; ctx.strokeStyle = o.halo; ctx.lineJoin = 'round'; ctx.strokeText(str, 0, 0); }
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

// ============================================================ BACKGROUNDS
function paper(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
function polka(color, t, gap = 120, r = 12) {
  ctx.fillStyle = color; const off = (t * 30) % gap;
  for (let y = -gap; y < H + gap; y += gap) for (let x = -gap; x < W + gap; x += gap) {
    const sx = x + off + ((y / gap) % 2 ? gap / 2 : 0); ctx.beginPath(); ctx.arc(sx, y + off, r, 0, 7); ctx.fill();
  }
}
function sunburst(x, y, t, c1, c2, n = 18) {
  paper(c1); ctx.save(); ctx.translate(x, y); ctx.rotate(t * .15); ctx.fillStyle = c2;
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 2200, a, a + Math.PI / n); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

// ============================================================ SCENES

const CUTS = [2, 4, 5, 6, 7, 8, 9, 10, 12.5, 15, 18.5, 20, 25, 28];

function render(t) {
  T = t; BOIL = Math.floor(t * 8);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  let punch = 0;
  for (const c of CUTS) if (t >= c && t < c + .3) punch = Math.max(punch, Math.sin((t - c) / .3 * Math.PI) * .03);
  ctx.save(); ctx.translate(CX, H / 2); ctx.scale(1 + punch, 1 + punch); ctx.translate(-CX, -H / 2);
  if (t < 2) scene1(t);
  else if (t < 4) scene2(t);
  else if (t < 10) scene3(t);
  else if (t < 15) scene4(t);
  else if (t < 20) scene5(t);
  else if (t < 25) scene6(t);
  else scene7(t);
  ctx.restore();
  // paper grain over everything + soft vignette
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(A.paper, 0, 0, W, H); ctx.restore();
  // quick white "page flip" wipe on scene changes
  for (const c of [2, 4, 9, 10, 12.5, 15, 18.5, 20, 25]) if (t >= c && t < c + .18) { ctx.fillStyle = `rgba(255,250,240,${.6 * (1 - (t - c) / .18)})`; ctx.fillRect(0, 0, W, H); }
  const fade = Math.max(1 - seg(t, 0, .2), seg(t, 29.6, 30));
  if (fade > 0) { ctx.fillStyle = `rgba(255,250,240,${fade})`; ctx.fillRect(0, 0, W, H); }
}

}
function makePaper() {

  for (let i = 0; i < id.data.length; i += 4) { const v = 238 + R() * 17; id.data[i] = v; id.data[i + 1] = v - 2; id.data[i + 2] = v - 8; id.data[i + 3] = 255; }

  return c;
}
