<html lang="hi">

  @font-face { font-family: Yatra; src: url(fonts/YatraOne-Regular.ttf); }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================ EDIT ME
const BRAND   = 'Sri Desi Thekua';            // shown on the end card
const PHONE   = '+91 81782 26605';           // WhatsApp number for orders
const AREA    = 'DWARKA, NEW DELHI';
// ============================================================

const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- math helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const eInCubic = k => k * k * k;
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BEAT = 0.5;
const pulse = (t, a = 4, b = 25) => (t < a || t > b) ? 0 : Math.exp(-((t - a) % BEAT) * 9);

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ============================================================ ASSETS
const A = {};

function thekuaShape(g, w, h, r, edgeAmp = 1) {
  // scalloped oval (the edge the wooden sancha leaves)
  g.beginPath();
  const n = 220;
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    const sc = 1 + 0.028 * edgeAmp * Math.sin(a * 22) + 0.018 * Math.sin(a * 3 + r) + 0.012 * Math.sin(a * 5 + r * 2);
    const x = w / 2 + Math.cos(a) * w * 0.46 * sc;
    const y = h / 2 + Math.sin(a) * h * 0.46 * sc;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}

// doneness: 0 raw dough, 1 golden fried. pattern: 0 smooth ball, 1 pressed
function makeThekua(seed, done = 1, pattern = 1, S = 620) {
  const w = S, h = Math.round(S * 0.8);
  const c = mk(w, h), g = c.getContext('2d');
  const R = mulberry(seed);
  const rr = R() * 6;
  const col = (raw, gold) => raw.map((v, i) => Math.round(lerp(v, gold[i], done)));
  const mid = col([236, 214, 168], [196, 110, 34]);
  const hi = col([248, 234, 200], [236, 168, 72]);
  const edge = col([200, 170, 120], [96, 40, 8]);
  const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;

  g.save();
  thekuaShape(g, w, h, rr);
  g.clip();
  const bg = g.createRadialGradient(w * .42, h * .38, 10, w * .5, h * .5, w * .55);
  bg.addColorStop(0, rgb(hi)); bg.addColorStop(.55, rgb(mid)); bg.addColorStop(1, rgb(edge));
  g.fillStyle = bg; g.fillRect(0, 0, w, h);

  // fine texture speckles
  for (let i = 0; i < 2600; i++) {
    const x = R() * w, y = R() * h, s = R() * 2.4 + .4;
    g.fillStyle = R() < .5 ? `rgba(70,30,5,${.08 + .18 * done * R()})` : `rgba(255,240,200,${.10 * R()})`;
    g.fillRect(x, y, s, s);
  }

  if (pattern > 0) {
    g.globalAlpha = pattern;
    const ox = w / 2, oy = h * 0.93;
    // fan / shell ridges radiating from the base
    const ridges = 13;
    for (let i = 0; i < ridges; i++) {
      const a = lerp(-1.25, 1.25, i / (ridges - 1));
      const len = h * 0.86;
      const ex = ox + Math.sin(a) * len * 1.05, ey = oy - Math.cos(a) * len;
      const cx1 = ox + Math.sin(a) * len * 0.45 + a * 16, cy1 = oy - Math.cos(a) * len * 0.5;
      const path = () => { g.beginPath(); g.moveTo(ox + Math.sin(a) * 34, oy - 30); g.quadraticCurveTo(cx1, cy1, ex, ey); };
      g.save(); g.filter = 'blur(4px)'; g.translate(3, 4); path(); g.strokeStyle = `rgba(${lerp(110, 55, done)},${lerp(80, 20, done)},${lerp(40, 2, done)},${lerp(.55, .75, done)})`; g.lineWidth = 15; g.lineCap = 'round'; g.stroke(); g.restore();
      path(); g.strokeStyle = `rgba(${lerp(120, 70, done)},${lerp(90, 28, done)},${lerp(50, 4, done)},0.6)`; g.lineWidth = 6; g.lineCap = 'round'; g.stroke();
      g.save(); g.filter = 'blur(2px)'; g.translate(-6, -5); path(); g.strokeStyle = `rgba(255,232,180,${lerp(.5, .45, done)})`; g.lineWidth = 6; g.stroke(); g.restore();
    }
    // centre vein + dotted border ring (mould detail)
    g.beginPath(); g.ellipse(ox, oy - 26, 34, 24, 0, Math.PI, 0); g.strokeStyle = 'rgba(70,30,5,.45)'; g.lineWidth = 7; g.stroke();
    for (let i = 0; i < 64; i++) {
      const a = i / 64 * Math.PI * 2;
      const x = w / 2 + Math.cos(a) * w * .39, y = h / 2 + Math.sin(a) * h * .39;
      g.beginPath(); g.arc(x, y, 5.5, 0, 7); g.fillStyle = `rgba(70,30,5,${.35 + .1 * done})`; g.fill();
      g.beginPath(); g.arc(x - 1.8, y - 1.8, 2.6, 0, 7); g.fillStyle = 'rgba(255,235,190,.35)'; g.fill();
    }
    g.globalAlpha = 1;
  }

  // fennel seeds + coconut flecks
  for (let i = 0; i < 26; i++) {
    const a = R() * 7, d = Math.sqrt(R()) * .38;
    const x = w / 2 + Math.cos(a) * w * d, y = h / 2 + Math.sin(a) * h * d;
    g.save(); g.translate(x, y); g.rotate(R() * 7);
    if (R() < .6) {
      g.beginPath(); g.ellipse(0, 0, 9, 3.4, 0, 0, 7); g.fillStyle = `rgb(${lerp(140, 110, done)},${lerp(135, 95, done)},${lerp(70, 30, done)})`; g.fill();
      g.beginPath(); g.ellipse(-1, -1, 6, 1.2, 0, 0, 7); g.fillStyle = 'rgba(255,240,180,.4)'; g.fill();
    } else {
      g.beginPath(); g.ellipse(0, 0, 6, 2.2, 0, 0, 7); g.fillStyle = `rgba(255,245,225,${.55 - .25 * done})`; g.fill();
    }
    g.restore();
  }

  // caramelised rim + inner edge shadow
  g.globalCompositeOperation = 'multiply';
  const rim = g.createRadialGradient(w / 2, h / 2, w * .25, w / 2, h / 2, w * .5);
  rim.addColorStop(0, 'rgba(255,255,255,0)'); rim.addColorStop(1, `rgba(${lerp(170, 90, done)},${lerp(140, 40, done)},${lerp(100, 10, done)},.9)`);
  g.fillStyle = rim; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-over';
  g.filter = 'blur(10px)';
  thekuaShape(g, w, h, rr); g.lineWidth = 30; g.strokeStyle = `rgba(60,25,5,${.25 + .3 * done})`; g.stroke();
  g.filter = 'none';
  // ghee sheen
  g.globalCompositeOperation = 'screen';
  const sh = g.createRadialGradient(w * .36, h * .3, 0, w * .36, h * .3, w * .32);
  sh.addColorStop(0, `rgba(255,236,190,${.28 + .22 * done})`); sh.addColorStop(1, 'rgba(255,236,190,0)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  g.restore();
  g.globalCompositeOperation = 'source-over';
  return c;
}

function makeDoughBall(S = 420) {
  const c = mk(S, S), g = c.getContext('2d');
  const gr = g.createRadialGradient(S * .38, S * .34, 10, S / 2, S / 2, S * .5);
  gr.addColorStop(0, '#fbf1d9'); gr.addColorStop(.6, '#e8d2a2'); gr.addColorStop(1, '#b89763');
  g.beginPath(); g.arc(S / 2, S / 2, S * .47, 0, 7); g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  const R = mulberry(99);
  for (let i = 0; i < 900; i++) { g.fillStyle = R() < .5 ? 'rgba(120,80,30,.12)' : 'rgba(255,255,240,.15)'; g.fillRect(R() * S, R() * S, 2, 2); }
  for (let i = 0; i < 14; i++) { g.save(); g.translate(R() * S, R() * S); g.rotate(R() * 7); g.beginPath(); g.ellipse(0, 0, 8, 3, 0, 0, 7); g.fillStyle = 'rgba(130,120,60,.8)'; g.fill(); g.restore(); }
  g.restore();
  return c;
}

function makeWood() {
  const c = mk(W, H), g = c.getContext('2d');
  g.fillStyle = '#2a170c'; g.fillRect(0, 0, W, H);
  const R = mulberry(5);
  const planks = 4, pw = W / planks;
  for (let p = 0; p < planks; p++) {
    const tone = 0.85 + R() * 0.3;
    g.fillStyle = `rgb(${Math.round(58 * tone)},${Math.round(34 * tone)},${Math.round(18 * tone)})`;
    g.fillRect(p * pw, 0, pw, H);
    for (let i = 0; i < 90; i++) {
      const x0 = p * pw + R() * pw, amp = 4 + R() * 14, fr = .002 + R() * .004, ph = R() * 7;
      g.beginPath();
      for (let y = 0; y <= H; y += 16) { const x = x0 + Math.sin(y * fr + ph) * amp; y ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.strokeStyle = R() < .5 ? `rgba(20,10,4,${.15 + R() * .3})` : `rgba(120,78,44,${.06 + R() * .14})`;
      g.lineWidth = .8 + R() * 2.6; g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(p * pw - 2, 0, 4, H);
  }
  return c;
}

function makeBrassPlate(S = 1000) {
  const c = mk(S, S), g = c.getContext('2d'), r = S / 2;
  const con = g.createConicGradient(0.6, r, r);
  const stops = ['#8a5a1c', '#f0cf7a', '#a8741f', '#e2b85e', '#6f4612', '#f7dc8f', '#9a6a1d', '#8a5a1c'];
  stops.forEach((s, i) => con.addColorStop(i / (stops.length - 1), s));
  g.beginPath(); g.arc(r, r, r * .98, 0, 7); g.fillStyle = con; g.fill();
  // inner well
  const inner = g.createRadialGradient(r * .8, r * .75, 20, r, r, r * .8);
  inner.addColorStop(0, '#f3d58b'); inner.addColorStop(.6, '#c39336'); inner.addColorStop(1, '#7c5215');
  g.beginPath(); g.arc(r, r, r * .8, 0, 7); g.fillStyle = inner; g.fill();
  for (const [rad, a] of [[.8, .5], [.83, .25], [.9, .2], [.96, .35]]) { g.beginPath(); g.arc(r, r, r * rad, 0, 7); g.strokeStyle = `rgba(60,35,5,${a})`; g.lineWidth = 3; g.stroke(); g.beginPath(); g.arc(r - 1.5, r - 1.5, r * rad, 0, 7); g.strokeStyle = `rgba(255,240,190,${a * .6})`; g.lineWidth = 1.5; g.stroke(); }
  // engraved dots on rim
  for (let i = 0; i < 90; i++) { const a = i / 90 * 7 * .8976; const x = r + Math.cos(a) * r * .865, y = r + Math.sin(a) * r * .865; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fillStyle = 'rgba(80,45,8,.45)'; g.fill(); }
  // brushed micro scratches
  const R = mulberry(3);
  g.save(); g.beginPath(); g.arc(r, r, r * .98, 0, 7); g.clip();
  for (let i = 0; i < 700; i++) { const a = R() * 7, d = R() * r; g.beginPath(); g.arc(r, r, d, a, a + .05 + R() * .2); g.strokeStyle = `rgba(255,245,210,${R() * .08})`; g.lineWidth = 1; g.stroke(); }
  g.restore();
  return c;
}

function makeLeaf(w = 1500, h = 760) {
  const c = mk(w, h), g = c.getContext('2d');
  g.beginPath(); g.moveTo(0, h * .5);
  g.bezierCurveTo(w * .2, -h * .05, w * .8, -h * .05, w, h * .45);
  g.bezierCurveTo(w * .8, h * 1.05, w * .2, h * 1.05, 0, h * .5); g.closePath();
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#2f6b1f'); gr.addColorStop(.5, '#4f9a32'); gr.addColorStop(1, '#255a17');
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  for (let x = -h; x < w + h; x += 9) {
    g.beginPath(); g.moveTo(x, h * .5); g.lineTo(x - h * .45, 0); g.moveTo(x, h * .5); g.lineTo(x - h * .45, h);
    g.strokeStyle = `rgba(${x % 27 ? '20,50,10' : '160,210,110'},.22)`; g.lineWidth = 1.5; g.stroke();
  }
  const sh = g.createRadialGradient(w * .35, h * .3, 10, w * .5, h * .5, w * .6);
  sh.addColorStop(0, 'rgba(220,255,180,.25)'); sh.addColorStop(1, 'rgba(0,20,0,.35)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  g.restore();
  g.fillStyle = '#a8cf78'; g.fillRect(0, h * .5 - 7, w, 14);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, h * .5 + 7, w, 5);
  return c;
}

function makeMarigold(seed, S = 160) {
  const c = mk(S, S), g = c.getContext('2d'), R = mulberry(seed);
  const base = R() < .5 ? [250, 95, 0] : [255, 150, 0];
  for (let i = 0; i < 240; i++) {
    const d = Math.pow(R(), .7) * S * .45, a = R() * 7;
    const x = S / 2 + Math.cos(a) * d, y = S / 2 + Math.sin(a) * d;
    const k = 0.78 + 0.22 * (1 - d / (S * .45)) * R();
    g.save(); g.translate(x, y); g.rotate(a);
    g.beginPath(); g.ellipse(0, 0, 10, 6, 0, 0, 7);
    g.fillStyle = `rgb(${Math.round(base[0] * k)},${Math.round(base[1] * k)},${Math.round(base[2] * k)})`; g.fill();
    g.restore();
  }
  const sh = g.createRadialGradient(S * .4, S * .35, 2, S / 2, S / 2, S * .5);
  sh.addColorStop(0, 'rgba(255,200,80,.25)'); sh.addColorStop(.75, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(120,20,0,.4)');
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(0, 0, S, S);
  return c;
}

function makeJaggery(seed, S = 360) {
  const c = mk(S, S), g = c.getContext('2d'), R = mulberry(seed);
  const n = 7 + Math.floor(R() * 3), pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * 7 * .8976 + R() * .4, d = S * (.3 + R() * .14); pts.push([S / 2 + Math.cos(a) * d, S / 2 + Math.sin(a) * d]); }
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  const gr = g.createLinearGradient(0, 0, S, S);
  gr.addColorStop(0, '#d98a34'); gr.addColorStop(.5, '#9a4d12'); gr.addColorStop(1, '#5a2606');
  g.fillStyle = gr; g.fill(); g.save(); g.clip();
  // facets
  for (let i = 0; i < n; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n];
    g.beginPath(); g.moveTo(S / 2 + (R() - .5) * 40, S / 2 + (R() - .5) * 40); g.lineTo(x1, y1); g.lineTo(x2, y2); g.closePath();
    g.fillStyle = `rgba(${R() < .5 ? '255,200,120' : '40,15,0'},${.08 + R() * .18})`; g.fill();
  }
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(255,${190 + R() * 60},120,${R() * .35})`; g.fillRect(R() * S, R() * S, 1.5, 1.5); }
  g.restore();
  return c;
}

function makeGrain() {
  const out = [];
  for (let k = 0; k < 6; k++) {
    const c = mk(540, 960), g = c.getContext('2d'), id = g.createImageData(540, 960), R = mulberry(1000 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); out.push(c);
  }
  return out;
}

// ============================================================ DRAW PRIMITIVES
function drawImgC(img, x, y, s = 1, rot = 0, alpha = 1, shadow = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  if (shadow) { ctx.shadowColor = `rgba(0,0,0,${.55 * shadow})`; ctx.shadowBlur = 40 * shadow; ctx.shadowOffsetX = 18 * shadow * s; ctx.shadowOffsetY = 26 * shadow * s; }
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

const BOKEH = (() => { const R = mulberry(11), a = []; for (let i = 0; i < 46; i++) a.push({ x: R() * W, y: R() * H, r: 20 + R() * 80, sp: 10 + R() * 40, ph: R() * 7, hue: R() }); return a; })();
function bokeh(t, amt = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const y = ((b.y - t * b.sp) % H + H) % H, x = b.x + Math.sin(t * .6 + b.ph) * 20;
    const tw = .5 + .5 * Math.sin(t * 2 + b.ph);
    const c = b.hue < .6 ? 'rgba(255,170,60,A)' : b.hue < .85 ? 'rgba(255,220,150,A)' : 'rgba(255,120,40,A)';
    const g = ctx.createRadialGradient(x, y, b.r * .6, x, y, b.r);
    g.addColorStop(0, c.replace('A', .10 * amt * (.5 + tw * .5))); g.addColorStop(.85, c.replace('A', .07 * amt)); g.addColorStop(1, c.replace('A', 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function diya(x, y, s, t, lit = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // glow
  if (lit > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const fl = 1 + .08 * Math.sin(t * 23) + .05 * Math.sin(t * 37 + 1);
    glow(0, -60, 420 * fl * lit, 'rgba(255,140,40,A)', .35 * lit);
    glow(0, -60, 140 * fl * lit, 'rgba(255,210,120,A)', .45 * lit);
    ctx.globalCompositeOperation = 'source-over';
  }
  // clay bowl
  const bg = ctx.createLinearGradient(0, -30, 0, 50);
  bg.addColorStop(0, '#b4552a'); bg.addColorStop(1, '#4a1a08');
  ctx.beginPath(); ctx.moveTo(-120, -10); ctx.quadraticCurveTo(-100, 55, 0, 58); ctx.quadraticCurveTo(100, 55, 120, -10);
  ctx.quadraticCurveTo(150, -30, 150, -40); ctx.lineTo(128, -22); ctx.quadraticCurveTo(0, -5, -120, -10); ctx.fillStyle = bg; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -12, 120, 20, 0, 0, 7); ctx.fillStyle = '#3a1406'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -10, 104, 14, 0, 0, 7); ctx.fillStyle = `rgba(230,160,40,${.5 + .4 * lit})`; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -12, 120, 20, 0, 0, 7); ctx.strokeStyle = '#d0703a'; ctx.lineWidth = 4; ctx.stroke();
  // flame
  if (lit > 0) {
    const sw = Math.sin(t * 9) * 6 + Math.sin(t * 17) * 3, hgt = (95 + Math.sin(t * 13) * 8) * lit;
    ctx.translate(120, -40);
    const fg = ctx.createRadialGradient(0, -hgt * .35, 2, 0, -hgt * .35, hgt * .7);
    fg.addColorStop(0, 'rgba(255,255,235,1)'); fg.addColorStop(.35, 'rgba(255,215,90,1)'); fg.addColorStop(.75, 'rgba(255,110,20,.85)'); fg.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.quadraticCurveTo(-26, -hgt * .5, sw, -hgt); ctx.quadraticCurveTo(26, -hgt * .5, 20, 0); ctx.quadraticCurveTo(0, 12, -20, 0);
    ctx.fillStyle = fg; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -8, 5, 12, 0, 0, 7); ctx.fillStyle = 'rgba(80,120,255,.55)'; ctx.fill();
  }
  ctx.restore();
}

function steam(x, y, t, amt = 1, spread = 220) {
  ctx.save(); ctx.filter = 'blur(14px)'; ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 5; i++) {
    const ph = i * 1.7, k = ((t * .35 + i * .2) % 1);
    ctx.beginPath();
    const x0 = x + (i - 2) * spread / 4;
    for (let j = 0; j <= 20; j++) {
      const yy = y - j * 26 - k * 120, xx = x0 + Math.sin(j * .35 + t * 1.8 + ph) * (12 + j * 3.5);
      j ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.strokeStyle = `rgba(255,245,230,${.14 * amt * Math.sin(k * Math.PI)})`; ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.stroke();
  }
  ctx.restore();
}

// particles: deterministic burst, rendered at time since start
function burst(seed, x, y, age, n, opt = {}) {
  if (age < 0 || age > (opt.life || 1.2)) return;
  const R = mulberry(seed), life = opt.life || 1.2;
  ctx.save(); ctx.globalCompositeOperation = opt.comp || 'source-over';
  for (let i = 0; i < n; i++) {
    const a = (opt.dir ?? -Math.PI / 2) + (R() - .5) * (opt.cone ?? 7), sp = (opt.speed || 700) * (.3 + R() * .7);
    const px = x + Math.cos(a) * sp * age * (1 - age / (2 * life)), py = y + Math.sin(a) * sp * age * (1 - age / (2 * life)) + (opt.grav || 0) * age * age;
    const sz = (opt.size || 6) * (.4 + R()), fade = 1 - age / life;
    ctx.globalAlpha = clamp(fade) * (opt.alpha || 1);
    ctx.fillStyle = opt.colors ? opt.colors[Math.floor(R() * opt.colors.length)] : '#fff';
    ctx.beginPath(); ctx.arc(px, py, sz, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---------- typography
function setFont(size, fam, style = '') { ctx.font = `${style} ${size}px ${fam}`; }

const TXT = mk(1400, 700), TG = TXT.getContext('2d');
// golden foil text with moving shimmer; drawn via offscreen so the shimmer only hits glyphs
function goldText(str, x, y, size, fam = 'Rozha', o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  TG.setTransform(1, 0, 0, 1, 0, 0); TG.clearRect(0, 0, TXT.width, TXT.height);
  TG.font = `${o.style || ''} ${size}px ${fam}`; TG.textAlign = 'center'; TG.textBaseline = 'middle';
  if (o.spacing) TG.letterSpacing = o.spacing + 'px'; else TG.letterSpacing = '0px';
  const tx = TXT.width / 2, ty = TXT.height / 2;
  const gr = TG.createLinearGradient(0, ty - size * .55, 0, ty + size * .55);
  (o.colors || ['#fff6d6', '#ffd66b', '#e59a22', '#fff0b8', '#b86f12']).forEach((c, i, arr) => gr.addColorStop(i / (arr.length - 1), c));
  TG.fillStyle = gr; TG.fillText(str, tx, ty);
  if (o.shimmer !== undefined) {
    TG.globalCompositeOperation = 'source-atop';
    const sx = lerp(-400, TXT.width + 400, o.shimmer);
    const sg = TG.createLinearGradient(sx - 160, 0, sx + 160, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.9)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    TG.fillStyle = sg; TG.fillRect(0, 0, TXT.width, TXT.height);
    TG.globalCompositeOperation = 'source-over';
  }
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(o.scale || 1, o.scale || 1);
  if (o.blur) ctx.filter = `blur(${o.blur}px)`;
  ctx.shadowColor = o.shadow || 'rgba(0,0,0,.65)'; ctx.shadowBlur = o.shadowBlur ?? 30; ctx.shadowOffsetY = 8;
  ctx.drawImage(TXT, -tx, -ty);
  if (o.glow) { ctx.shadowColor = 'transparent'; ctx.globalCompositeOperation = 'lighter'; ctx.filter = `blur(${24}px)`; ctx.globalAlpha *= o.glow; ctx.drawImage(TXT, -tx, -ty); }
  ctx.restore();
}

function plainText(str, x, y, size, fam, color, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(o.scale || 1, o.scale || 1);
  ctx.font = `${o.style || ''} ${size}px ${fam}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (o.spacing || 0) + 'px';
  if (o.blur) ctx.filter = `blur(${o.blur}px)`;
  ctx.shadowColor = o.shadow || 'rgba(0,0,0,.7)'; ctx.shadowBlur = o.shadowBlur ?? 18; ctx.shadowOffsetY = 4;
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}

// rise-in / fade-out envelope for a text element
function tin(t, a, b, dur = .45, out = .25) {
  const i = eOutCubic(seg(t, a, a + dur)), o = 1 - seg(t, b - out, b);
  return { a: i * o, y: (1 - i) * 60, blur: (1 - i) * 14 };
}

// letter-by-letter reveal for latin strings
function letters(str, x, y, size, fam, color, t, t0, o = {}) {
  ctx.save(); ctx.font = `${o.style || ''} ${size}px ${fam}`; ctx.letterSpacing = (o.spacing || 0) + 'px';
  const total = ctx.measureText(str).width; ctx.restore();
  let cx = x - total / 2;
  for (let i = 0; i < str.length; i++) {
    ctx.save(); ctx.font = `${o.style || ''} ${size}px ${fam}`; ctx.letterSpacing = (o.spacing || 0) + 'px';
    const cw = ctx.measureText(str[i]).width; ctx.restore();
    const k = eOutBack(seg(t, t0 + i * (o.stagger ?? .03), t0 + i * (o.stagger ?? .03) + .35));
    const fade = o.end ? 1 - seg(t, o.end - .2, o.end) : 1;
    plainText(str[i], cx + cw / 2, y + (1 - k) * 50, size, fam, color, { alpha: clamp(k) * fade, style: o.style, spacing: 0, shadowBlur: o.shadowBlur });
    cx += cw;
  }
}

function drawAtta(t, lt) {
  const x = CX, y = 1150;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;

  ctx.beginPath(); ctx.ellipse(x, y, 400, 330, 0, 0, 7); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  const R = mulberry(7);
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, 400, 330, 0, 0, 7); ctx.clip();
  for (let i = 0; i < 1500; i++) { ctx.fillStyle = R() < .5 ? 'rgba(150,120,70,.25)' : 'rgba(255,255,250,.35)'; ctx.fillRect(x - 400 + R() * 800, y - 330 + R() * 660, 2, 2); }

  ctx.save(); ctx.filter = 'blur(30px)'; ctx.globalAlpha = .35 * (1 - seg(lt, 0, 1)); ctx.fillStyle = '#fff5e0'; ctx.beginPath(); ctx.ellipse(x, y - 250 - lt * 150, 360, 180, 0, 0, 7); ctx.fill(); ctx.restore();
}

function drawJaggery(t, lt) {
  const pos = [[CX, 1150, 1.5, 0], [CX - 290, 1000, .9, 1], [CX + 300, 1020, 1, 2], [CX - 240, 1380, .85, 3], [CX + 260, 1360, .8, 4]];
  pos.forEach(([x, y, s, i]) => {

    drawImgC(A.jag[i], x, y - (1 - k) * 300, s * clamp(k, 0, 2), .3 * i + lt * .1 * (i % 2 ? 1 : -1), clamp(k * 3), 1);
  });
  // sparkles
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const R = mulberry(17);
  for (let i = 0; i < 18; i++) { const x = CX + (R() - .5) * 700, y = 1150 + (R() - .5) * 500, p = Math.sin(t * 6 + i) * .5 + .5; glow(x, y, 26 * p + 4, 'rgba(255,220,150,A)', .8 * p); }

function drawGhee(t, lt) {
  const x = CX, y = 1200;
  drawImgC(A.plate, x, y, .62, 0, 1, 1);
  const g = ctx.createRadialGradient(x - 80, y - 80, 10, x, y, 250);
  g.addColorStop(0, '#fff2b0'); g.addColorStop(.4, '#f5c643'); g.addColorStop(1, '#c7881a');
  ctx.beginPath(); ctx.arc(x, y, 245, 0, 7); ctx.fillStyle = g; ctx.fill();
  // grain of ghee
  const R = mulberry(12);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, 245, 0, 7); ctx.clip();
  for (let i = 0; i < 300; i++) { ctx.fillStyle = `rgba(255,250,220,${R() * .35})`; ctx.beginPath(); ctx.arc(x + (R() - .5) * 490, y + (R() - .5) * 490, R() * 5, 0, 7); ctx.fill(); }
  // ripple rings from the drop
  const hit = .35;
  for (let r = 0; r < 4; r++) {
    const age = lt - hit - r * .12; if (age < 0) continue;
    ctx.beginPath(); ctx.arc(x, y, age * 420, 0, 7); ctx.strokeStyle = `rgba(255,250,210,${.6 * (1 - clamp(age / .8))})`; ctx.lineWidth = 6; ctx.stroke();
  }
  ctx.restore();
  // specular highlight
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.beginPath(); ctx.ellipse(x - 90, y - 110, 90, 36, -.6, 0, 7); ctx.fillStyle = 'rgba(255,255,240,.45)'; ctx.filter = 'blur(8px)'; ctx.fill(); ctx.restore();
  // falling drop
  if (lt < hit) {
    const k = eInCubic(lt / hit), dy = lerp(420, y - 10, k);
    const dg = ctx.createRadialGradient(x - 8, dy - 12, 2, x, dy, 40);
    dg.addColorStop(0, '#fffbe0'); dg.addColorStop(1, '#e8a91f');
    ctx.beginPath(); ctx.moveTo(x, dy - 70); ctx.quadraticCurveTo(x + 36, dy, x, dy + 32); ctx.quadraticCurveTo(x - 36, dy, x, dy - 70); ctx.fillStyle = dg; ctx.fill();
  }
  burst(41, x, y, lt - hit, 36, { speed: 800, size: 9, colors: ['#ffe07a', '#fff4c0', '#f2b631'], life: .7, cone: 2.6, grav: 1600 });
}

function drawCoconut(t, lt) {
  const x = CX, y = 1150, rot = lt * .2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 30;
  ctx.beginPath(); ctx.arc(0, 0, 360, 0, 7); ctx.fillStyle = '#5a3217'; ctx.fill(); ctx.shadowColor = 'transparent';
  const R = mulberry(8);
  for (let i = 0; i < 600; i++) { const a = R() * 7, d = 330 + R() * 30; ctx.beginPath(); ctx.moveTo(Math.cos(a) * d, Math.sin(a) * d); ctx.lineTo(Math.cos(a + .05) * (d + 12), Math.sin(a + .05) * (d + 12)); ctx.strokeStyle = `rgba(${150 + R() * 60},${90 + R() * 40},50,.6)`; ctx.lineWidth = 2; ctx.stroke(); }
  const fg = ctx.createRadialGradient(-60, -60, 20, 0, 0, 330);
  fg.addColorStop(0, '#ffffff'); fg.addColorStop(.8, '#f4efe2'); fg.addColorStop(1, '#d8cdb5');
  ctx.beginPath(); ctx.arc(0, 0, 325, 0, 7); ctx.fillStyle = fg; ctx.fill();
  const ig = ctx.createRadialGradient(40, 40, 20, 0, 0, 240);
  ig.addColorStop(0, '#fbf7ee'); ig.addColorStop(1, '#e2d8c2');
  ctx.beginPath(); ctx.arc(0, 0, 245, 0, 7); ctx.fillStyle = ig; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 245, 0, 7); ctx.strokeStyle = 'rgba(150,130,100,.5)'; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
  // grated flakes flying
  const R2 = mulberry(9);
  for (let i = 0; i < 70; i++) {
    const a = R2() * 7, d0 = 380 + R2() * 150, k = eOutCubic(seg(lt, 0, .6));
    const px = x + Math.cos(a) * d0 * (0.4 + .6 * k), py = y + Math.sin(a) * d0 * (0.4 + .6 * k);
    ctx.save(); ctx.translate(px, py); ctx.rotate(a + lt * 2 * (i % 2 ? 1 : -1));
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 4.5, 0, 0, 7); ctx.fillStyle = `rgba(255,252,240,${.9 * k})`; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; ctx.fill(); ctx.restore();
  }
}

function drawSpice(t, lt) {
  const R = mulberry(13);

}

  burst(52, CX, 1120, lt - 1.0, 60, { speed: 1300, size: 5, colors: ['rgba(255,250,235,.8)'], life: .8, cone: 7 });

  // iron kadhai

  kg.addColorStop(0, '#4a4642'); kg.addColorStop(.7, '#1d1b1a'); kg.addColorStop(1, '#0a0909');

  ctx.beginPath(); ctx.arc(kx, ky, 700, 0, 7); ctx.strokeStyle = 'rgba(200,190,180,.25)'; ctx.lineWidth = 6; ctx.stroke();
  // ghee/oil

  og.addColorStop(0, '#f0b940'); og.addColorStop(.55, '#b8741a'); og.addColorStop(1, '#4a2806');
  ctx.beginPath(); ctx.arc(kx, ky, 600, 0, 7); ctx.fillStyle = og; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(kx, ky, 600, 0, 7); ctx.clip();
  // thekuas turning golden
  const done = eInOut(seg(lt, .2, 2.0));
  const P = [[-210, -170, .75, .4], [230, -110, .72, -.7], [-20, 230, .78, 1.9]];
  P.forEach(([dx, dy, s, r], i) => {
    const x = kx + dx + Math.sin(t * 1.3 + i) * 12, y = ky + dy + Math.cos(t * 1.1 + i) * 10, rot = r + t * .15 * (i % 2 ? 1 : -1);

  const R = mulberry(61);
  for (let i = 0; i < 260; i++) {

    const pidx = Math.floor(R() * 3), [dx, dy] = P[pidx], a = R() * 7, d = 190 + R() * 90;

  ctx.restore();

  const words = [['Golden.', 13.0], ['Crispy.', 13.5], ['Perfect.', 14.0]];
  words.forEach(([w, a], i) => {

  });

// ---- S4 15-20: hero plate, then the crunch
function plateScene(t, rot, cam = 1) {

// ============================================================ POST + TIMELINE
const CUTS = [2, 4, 5, 6, 7, 8, 9, 10, 12.5, 15, 18.5, 20, 21, 22, 23, 24, 25, 28];

function post(t) {
  // warm grade + vignette
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,170,90,.18)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(CX, CY, H * .3, CX, CY, H * .72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.72)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // drifting light leak
  ctx.globalCompositeOperation = 'screen';
  const lx = W * (.5 + .6 * Math.sin(t * .35)), ly = H * (.3 + .25 * Math.cos(t * .27));
  const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 900);
  lg.addColorStop(0, 'rgba(255,120,40,.13)'); lg.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  // flash on cuts
  let flash = 0;
  for (const c of CUTS) if (t >= c && t < c + .25) flash = Math.max(flash, (1 - (t - c) / .25) * (c === 2 || c === 25 || c === 15 || c === 28 ? .55 : .22));
  if (flash > 0) { ctx.fillStyle = `rgba(255,225,180,${flash})`; ctx.fillRect(0, 0, W, H); }
  // film grain
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .09;
  ctx.drawImage(A.grain[Math.floor(t * 24) % A.grain.length], 0, 0, W, H);
  ctx.restore();
  // letterbox thin cinematic bars + fade in/out
  const fade = Math.max(1 - seg(t, 0, .25), seg(t, 29.55, 30));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  // punch-zoom on every cut + beat bounce
  let punch = 0;
  for (const c of CUTS) if (t >= c && t < c + .4) punch = Math.max(punch, (1 - eOutExpo((t - c) / .4)) * .07);
  const z = 1 + punch + .008 * pulse(t, 4, 25);
  ctx.save(); ctx.translate(CX, CY); ctx.scale(z, z); ctx.translate(-CX, -CY);
  if (t < 4) scene1(t);
  else if (t < 10) scene2(t);
  else if (t < 15) scene3(t);
  else if (t < 20) scene4(t);
  else if (t < 25) scene5(t);
  else scene6(t);
  ctx.restore();
  post(t);
}

  A.thekua = [101, 202, 303, 404, 505].map(s => makeThekua(s, 1, 1));

  A.leaf = makeLeaf();
  A.mari = [1, 2, 3, 4].map(s => makeMarigold(s));
  A.jag = [1, 2, 3, 4, 5].map(s => makeJaggery(s * 7));
  A.grain = makeGrain();
  // pre-blurred plate backdrop for the promise cards
  plateScene(0, .6, 1.25);
  A.blurPlate = mk(W, H);
  const bg = A.blurPlate.getContext('2d'); bg.filter = 'blur(26px)'; bg.drawImage(cv, 0, 0);
  window.READY = true;
}

window.renderFrame = t => { render(t); };
window.frameJPEG = (t, q = .93) => { render(t); return cv.toDataURL('image/jpeg', q); };
init();

// live preview when opened directly in a browser
if (!/[?&]capture/.test(location.search)) {
  const t0 = performance.now();
  const loop = () => { if (window.READY) render(((performance.now() - t0) / 1000) % 30); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
