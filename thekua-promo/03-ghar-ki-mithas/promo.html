<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Ghar ki Mithas</title>
<style>
  @font-face { font-family: Tiro; src: url(../fonts/TiroDevanagariHindi-Regular.ttf); }
  @font-face { font-family: Fraunces; src: url(../fonts/Fraunces-Italic.ttf); font-style: italic; font-weight: 100 900; }
  @font-face { font-family: Fraunces; src: url(../fonts/Fraunces.ttf); font-style: normal; font-weight: 100 900; }
  @font-face { font-family: Kalam; src: url(../fonts/Kalam-Bold.ttf); }
  @font-face { font-family: Poppins; src: url(../fonts/Poppins-SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 360px; height: 640px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================ EDIT ME
const BRAND = 'Sri Desi Thekua';
const PHONE = '+91 81782 26605';
const AREA  = 'Dwarka, New Delhi';
// ============================================================
//
// "Ghar ki Mithas": one unbroken camera move that follows a single thekua
//   kitchen at dawn -> (through the window) -> Chhath ghat at sunrise -> (into the thekua) ->
//   hostel room at night -> (into the phone) -> family evening in the rain -> (out of the window) ->
//   the whole building at dusk -> up into the sky for the end card.
// Portals: a scene draws the next scene live inside a 9:16 window/phone, and the camera zooms
// through it until it fills the frame, so there is never a hard cut.

const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eSine = k => .5 - .5 * Math.cos(Math.PI * k);
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
let T = 0;

// ---------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function rad(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function glow(x, y, r, rgb, a) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rad(x, y, 0, r, [`rgba(${rgb},${a})`, `rgba(${rgb},${a * .35})`, `rgba(${rgb},0)`]); ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }
function stroke(color, w, cap = 'round') { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = cap; ctx.lineJoin = 'round'; ctx.stroke(); }

// ---------- cameras
// zoom so that world (fx,fy) drifts to the frame centre as z grows (identity at z = 1)
function camFocus(z, fx, fy, zMax) {
  const k = zMax > 1 ? clamp((1 - 1 / z) / (1 - 1 / zMax)) : 0;
  const cx = lerp(CX, fx, k), cy = lerp(CY, fy, k);
  ctx.translate(CX, CY); ctx.scale(z, z); ctx.translate(-cx, -cy);
}
// portal: rect r (9:16, scene coords) grows to exactly fill the frame at p = 1
function portalZ(p, r) { const zEnd = W / r.w; return { z: Math.pow(zEnd, p), Fx: r.x * zEnd / (zEnd - 1), Fy: r.y * zEnd / (zEnd - 1) }; }
function portalCam(p, r) { const { z, Fx, Fy } = portalZ(p, r); ctx.translate(Fx, Fy); ctx.scale(z, z); ctx.translate(-Fx, -Fy); }
function portalMap(p, r, x, y) { const { z, Fx, Fy } = portalZ(p, r); return [Fx + (x - Fx) * z, Fy + (y - Fy) * z, z]; }
// draw a whole scene shrunk into rect r
function inset(r, radius, fn) {
  ctx.save(); rr(r.x, r.y, r.w, r.h, radius); ctx.clip();
  ctx.translate(r.x, r.y); ctx.scale(r.w / W, r.h / H); fn(); ctx.restore();
}

// ============================================================ ASSETS
const A = {};
function makeThekua(S = 420) {
  const w = S, h = Math.round(S * .8), c = mk(w, h), g = c.getContext('2d');
  const shape = () => {
    g.beginPath();
    for (let i = 0; i <= 200; i++) {
      const a = i / 200 * Math.PI * 2, sc = 1 + .03 * Math.sin(a * 22) + .012 * Math.sin(a * 3);
      const x = w / 2 + Math.cos(a) * w * .46 * sc, y = h / 2 + Math.sin(a) * h * .46 * sc;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  };
  g.save(); shape(); g.clip();
  const bg = g.createRadialGradient(w * .4, h * .36, 5, w * .5, h * .5, w * .55);
  bg.addColorStop(0, '#ffd27a'); bg.addColorStop(.45, '#ee8f26'); bg.addColorStop(1, '#a4420d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  const ox = w / 2, oy = h * .92;
  for (let i = 0; i < 13; i++) {
    const a = lerp(-1.2, 1.2, i / 12), ex = ox + Math.sin(a) * h * .9, ey = oy - Math.cos(a) * h * .85;
    const path = () => { g.beginPath(); g.moveTo(ox + Math.sin(a) * 26, oy - 22); g.quadraticCurveTo(ox + Math.sin(a) * h * .4, oy - Math.cos(a) * h * .42, ex, ey); };
    path(); g.strokeStyle = 'rgba(150,60,10,.55)'; g.lineWidth = w * .022; g.lineCap = 'round'; g.stroke();
    g.save(); g.translate(-w * .008, -w * .008); path(); g.strokeStyle = 'rgba(255,236,170,.55)'; g.lineWidth = w * .009; g.stroke(); g.restore();
  }
  for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2; g.beginPath(); g.arc(w / 2 + Math.cos(a) * w * .385, h / 2 + Math.sin(a) * h * .385, w * .011, 0, 7); g.fillStyle = 'rgba(150,60,10,.5)'; g.fill(); }
  const R = mulberry(4);
  for (let i = 0; i < 16; i++) { g.save(); g.translate(w / 2 + (R() - .5) * w * .55, h / 2 + (R() - .5) * h * .5); g.rotate(R() * 7); g.beginPath(); g.ellipse(0, 0, w * .018, w * .007, 0, 0, 7); g.fillStyle = '#7d7a2a'; g.fill(); g.restore(); }
  const rim = g.createRadialGradient(w / 2, h / 2, w * .3, w / 2, h / 2, w * .5);
  rim.addColorStop(0, 'rgba(120,40,0,0)'); rim.addColorStop(1, 'rgba(120,40,0,.55)');
  g.fillStyle = rim; g.fillRect(0, 0, w, h);
  const sh = g.createRadialGradient(w * .34, h * .28, 0, w * .34, h * .28, w * .3);
  sh.addColorStop(0, 'rgba(255,250,220,.55)'); sh.addColorStop(1, 'rgba(255,250,220,0)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  g.restore();
  return c;
}
function makeGrain() {
  const c = mk(540, 960), g = c.getContext('2d'), id = g.createImageData(540, 960), R = mulberry(9);
  for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
function thekua(x, y, s, rot = 0, alpha = 1) {
  const img = A.thekua; ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.drawImage(img, -img.width / 2, -img.height / 2); ctx.restore();
}

// ============================================================ PEOPLE
// drawn around the neck base (0,0); head centre at (0,-100); hands given in the same local coords
function arm(side, sh, hand, o, sleeveCol, skin, s) {
  const L1 = 150, L2 = 140;
  let dx = hand[0] - sh[0], dy = hand[1] - sh[1], d = Math.hypot(dx, dy);
  const dm = Math.min(d, L1 + L2 - 2); const ux = dx / d, uy = dy / d;
  const a = (L1 * L1 - L2 * L2 + dm * dm) / (2 * dm), hh = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  let px = -uy, py = ux; if (px * side < 0 || (Math.abs(px) < .2 && py < 0)) { px = -px; py = -py; }
  const el = [sh[0] + ux * a + px * hh * (o.bend ?? 1), sh[1] + uy * a + py * hh * (o.bend ?? 1)];
  const hx = sh[0] + ux * dm, hy = sh[1] + uy * dm;
  ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(el[0], el[1]); stroke(sleeveCol, 58);
  ctx.beginPath(); ctx.moveTo(el[0], el[1]); ctx.lineTo(hx, hy); stroke(o.fullSleeve ? sleeveCol : skin, o.fullSleeve ? 52 : 42);
  if (o.bangles) { for (let k = 0; k < 2; k++) { const f = .78 + k * .07; ctx.beginPath(); ctx.arc(lerp(el[0], hx, f), lerp(el[1], hy, f), 22, 0, 7); stroke(k ? '#e8162c' : '#ffcc33', 6); } }
  ell(hx, hy, 29, 29, skin);
  ell(hx - 8, hy - 8, 10, 8, 'rgba(255,255,255,.12)');
  return [hx, hy];
}
function person(o) {
  const s = o.s || 1, skin = o.skin, tw = o.tw || 150, th = o.th || 420;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(s, s); ctx.rotate(o.lean || 0);
  const hairC = o.hairC || '#1d1030';
  // behind
  if (o.hair === 'long' || o.hair === 'pony') {
    ctx.beginPath(); ctx.moveTo(-70, -120);
    const sw = Math.sin(T * 3) * 8;
    if (o.hair === 'pony') { ctx.moveTo(40, -160); ctx.bezierCurveTo(130 + sw, -150, 120 + sw, -20, 80 + sw, 60); ctx.bezierCurveTo(60, 0, 70, -80, 20, -150); ctx.fillStyle = hairC; ctx.fill(); }
    else { rr(-80, -150, 160, 260, 60); ctx.fillStyle = hairC; ctx.fill(); }
  }
  if (o.veil) { ctx.beginPath(); ctx.ellipse(0, -112, 92, 100, 0, Math.PI, 0); ctx.lineTo(128, 60); ctx.lineTo(-128, 60); ctx.closePath(); ctx.fillStyle = o.veil; ctx.fill(); }
  if (o.hair === 'pigtails') for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 78, -60, 26, 62, sd * .25 + Math.sin(T * 4) * .08, 0, 7); ctx.fillStyle = hairC; ctx.fill(); ell(sd * 70, -118, 18, 12, '#ff2e88'); }
  // torso
  ctx.beginPath(); ctx.moveTo(-tw * .98, th); ctx.lineTo(-tw, 80); ctx.quadraticCurveTo(-tw, 16, -tw * .55, 10); ctx.lineTo(tw * .55, 10); ctx.quadraticCurveTo(tw, 16, tw, 80); ctx.lineTo(tw * .98, th); ctx.closePath();
  ctx.fillStyle = lin(-tw, 0, tw, th, [shade(o.outfit, .12), o.outfit, shade(o.outfit, -.18)]); ctx.fill();
  ctx.save(); ctx.clip();
  if (o.pallu) {
    ctx.beginPath(); ctx.moveTo(-tw * .55, 0); ctx.lineTo(-tw * .1, 0); ctx.lineTo(tw * 1.1, th * .75); ctx.lineTo(tw * .7, th); ctx.closePath();
    ctx.fillStyle = o.pallu; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-tw * .1, 0); ctx.lineTo(tw * 1.1, th * .75); stroke(o.trim || '#ffcc33', 14, 'butt');
    ctx.setLineDash([2, 16]); ctx.beginPath(); ctx.moveTo(-tw * .5, 8); ctx.lineTo(tw * .75, th); stroke(o.trim || '#ffcc33', 8); ctx.setLineDash([]);
  }
  if (o.kurta) { ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, 170); stroke(shade(o.outfit, -.25), 5); for (let k = 0; k < 3; k++) ell(8, 50 + k * 45, 6, 6, o.trim || '#e0b04a'); }
  if (o.vest) { ctx.beginPath(); ctx.moveTo(-tw, 60); ctx.lineTo(-30, 10); ctx.lineTo(-10, th); ctx.lineTo(-tw, th); ctx.closePath(); ctx.moveTo(tw, 60); ctx.lineTo(30, 10); ctx.lineTo(10, th); ctx.lineTo(tw, th); ctx.closePath(); ctx.fillStyle = o.vest; ctx.fill(); }
  if (o.hoodie) { ctx.beginPath(); ctx.moveTo(-18, 20); ctx.lineTo(-24, 120); ctx.moveTo(18, 20); ctx.lineTo(24, 120); stroke('#fff4d6', 6); ctx.beginPath(); ctx.ellipse(0, 10, 90, 40, 0, 0, Math.PI); stroke(shade(o.outfit, -.2), 10); }
  if (o.frockDots) { const R = mulberry(3); for (let k = 0; k < 20; k++) ell((R() - .5) * tw * 1.8, 40 + R() * th, 7, 7, 'rgba(255,255,255,.7)'); }
  ctx.restore();
  // neck + head
  ctx.fillStyle = shade(skin, -.12); ctx.fillRect(-24, -40, 48, 52);
  ctx.beginPath(); ctx.ellipse(0, 10, 44, 20, 0, 0, Math.PI); ctx.fillStyle = o.neckline || shade(o.outfit, -.1); ctx.fill();
  const tilt = o.tilt || 0;
  ctx.save(); ctx.translate(0, -30); ctx.rotate(tilt); ctx.translate(0, 30);
  ell(-58, -96, 12, 18, shade(skin, -.08)); ell(58, -96, 12, 18, shade(skin, -.08));
  ctx.beginPath(); ctx.ellipse(0, -100, 60, 70, 0, 0, 7); ctx.fillStyle = rad(-18, -120, 10, 90, [shade(skin, .1), skin, shade(skin, -.12)]); ctx.fill();
  if (o.earrings) for (const sd of [-1, 1]) { ell(sd * 60, -72, 7, 7, '#ffcc33'); ctx.beginPath(); ctx.moveTo(sd * 60 - 10, -60); ctx.quadraticCurveTo(sd * 60, -44, sd * 60 + 10, -60); ctx.closePath(); ctx.fillStyle = '#ffcc33'; ctx.fill(); }
  // hair (front)
  const hs = o.hair;
  if (hs === 'bun' || hs === 'greybun' || hs === 'long' || hs === 'pony' || hs === 'pigtails') {
    ctx.beginPath(); ctx.ellipse(0, -122, 64, 52, 0, Math.PI * .93, Math.PI * 2.07); ctx.quadraticCurveTo(30, -150, 0, -150); ctx.quadraticCurveTo(-30, -150, -62, -110); ctx.fillStyle = hairC; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -128, 62, 48, 0, Math.PI, 0); ctx.fillStyle = hairC; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-64, -118); ctx.quadraticCurveTo(-62, -80, -54, -70); ctx.lineTo(-50, -118); ctx.fill();
    ctx.beginPath(); ctx.moveTo(64, -118); ctx.quadraticCurveTo(62, -80, 54, -70); ctx.lineTo(50, -118); ctx.fill();
    if (hs === 'bun' || hs === 'greybun') ell(0, -178, 32, 26, hairC);
    ctx.beginPath(); ctx.moveTo(-4, -176); ctx.lineTo(-2, -142); stroke(o.sindoor ? '#e8162c' : shade(hairC, .2), o.sindoor ? 6 : 3);
    if (hs === 'greybun') for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(0, -110, 40 + k * 4, Math.PI * 1.15, Math.PI * 1.85); stroke('rgba(255,255,255,.25)', 2); }
  } else if (hs === 'short' || hs === 'boy') {
    ctx.beginPath(); ctx.ellipse(0, -130, 64, 46, 0, Math.PI * .95, Math.PI * 2.05); ctx.lineTo(56, -112); ctx.quadraticCurveTo(0, -140, -56, -112); ctx.closePath(); ctx.fillStyle = hairC; ctx.fill();
    if (hs === 'boy') for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 22 - 10, -165); ctx.lineTo(k * 22 + 4, -186); ctx.lineTo(k * 22 + 12, -165); ctx.fillStyle = hairC; ctx.fill(); }
  } else if (hs === 'grandpa') {
    ctx.beginPath(); ctx.ellipse(-50, -118, 16, 30, .2, 0, 7); ctx.ellipse(50, -118, 16, 30, -.2, 0, 7); ctx.fillStyle = hairC; ctx.fill();
    ell(-15, -152, 22, 10, 'rgba(255,255,255,.25)');
  }
  if (o.veil) {
    ctx.beginPath(); ctx.ellipse(0, -110, 72, 80, 0, Math.PI * 1.02, Math.PI * 1.98); stroke(o.veil, 34);
    ctx.beginPath(); ctx.ellipse(0, -110, 56, 64, 0, Math.PI * 1.05, Math.PI * 1.95); stroke(o.trim || '#ffcc33', 8);
  }
  // face
  const eyeY = -100;
  ctx.fillStyle = '#2a120a'; ctx.strokeStyle = '#2a120a';
  for (const sd of [-1, 1]) {
    if (o.eyes === 'open') { ell(sd * 22, eyeY, 7, 9, '#2a120a'); ell(sd * 22 + 2, eyeY - 3, 2.5, 2.5, '#fff'); }
    else { ctx.beginPath(); ctx.arc(sd * 22, eyeY - 6, 12, Math.PI * .18, Math.PI * .82); stroke('#2a120a', 5); }
    ctx.beginPath(); ctx.arc(sd * 22, eyeY - 12, 18, Math.PI * 1.25, Math.PI * 1.75); stroke(o.age ? '#bdb5ad' : '#2a120a', 5);
    ell(sd * 36, -76, 14, 8, 'rgba(255,90,110,.28)');
  }
  ctx.beginPath(); ctx.moveTo(-2, -92); ctx.quadraticCurveTo(-8, -80, 2, -78); stroke(shade(skin, -.3), 3.5);
  const m = o.mouth || 'smile';
  if (m === 'laugh') { ctx.beginPath(); ctx.moveTo(-20, -62); ctx.quadraticCurveTo(0, -30, 20, -62); ctx.closePath(); ctx.fillStyle = '#6b1f1f'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(-14, -62, 28, 6); }
  else if (m === 'bite' || m === 'o') { ell(0, -58, 10, m === 'bite' ? 8 : 11, '#6b1f1f'); }
  else { ctx.beginPath(); ctx.arc(0, -72, 16, Math.PI * .2, Math.PI * .8); stroke('#7a2323', 5); }
  if (o.moustache) { ctx.beginPath(); ctx.moveTo(-26, -66); ctx.quadraticCurveTo(0, -80, 26, -66); ctx.quadraticCurveTo(0, -70, -26, -66); ctx.fillStyle = o.moustache; ctx.fill(); stroke(o.moustache, 7); }
  if (o.bindi) ell(0, -132, 6, 6, '#e8162c');
  if (o.nath) { ctx.beginPath(); ctx.arc(10, -70, 11, -1.2, 2.4); stroke('#ffcc33', 3.5); }
  if (o.glasses) { for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(sd * 24, eyeY - 4, 20, 0, 7); stroke(o.glasses, 4); } ctx.beginPath(); ctx.moveTo(-4, eyeY - 6); ctx.lineTo(4, eyeY - 6); stroke(o.glasses, 4); }
  ctx.restore();
  // arms last, so hands can come up in front of the face
  const hands = {};
  for (const a of (o.arms || [])) {
    const side = a.side, sh = [side * tw * .74, 44];
    hands[side] = arm(side, sh, a.hand, a, a.sleeve || o.outfit, skin, s);
  }
  for (const it of (o.items || [])) { const hp = hands[it.side]; if (hp) { ctx.save(); ctx.translate(hp[0], hp[1]); it.fn(); ctx.restore(); } }
  ctx.restore();
}

// ============================================================ SCENE 1: kitchen at dawn (0 - 4.8)
const WIN1 = { x: 330, y: 150, w: 420, h: 420 * 16 / 9 };
function marigoldString(x0, x1, y, sag, n, seed, t) {
  const R = mulberry(seed);
  for (let i = 0; i <= n; i++) {
    const k = i / n, x = lerp(x0, x1, k), yy = y + Math.sin(k * Math.PI) * sag + Math.sin(t * 2 + i) * 2;
    if (i % 3 === 1) { ctx.save(); ctx.translate(x, yy + 26); ctx.rotate(.2 * Math.sin(i)); ctx.beginPath(); ctx.moveTo(0, -10); ctx.quadraticCurveTo(18, 20, 0, 50); ctx.quadraticCurveTo(-18, 20, 0, -10); ctx.fillStyle = '#1fa35b'; ctx.fill(); ctx.restore(); }
    const c = R() < .5 ? '#ff8c00' : '#ffc300';
    ell(x, yy, 20, 20, c); ell(x, yy, 11, 11, shade(c, -.2)); ell(x - 6, yy - 6, 6, 6, 'rgba(255,255,220,.45)');
  }
}
function jar(x, y, w, h, fill, lid) {
  rr(x - w / 2, y - h, w, h, 14); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  rr(x - w / 2 + 6, y - h * .72, w - 12, h * .68, 10); ctx.fillStyle = fill; ctx.fill();
  rr(x - w / 2 - 4, y - h - 18, w + 8, 22, 8); ctx.fillStyle = lid; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x - w / 2 + 10, y - h + 12, 8, h * .6);
}
function scene1(t) {
  const lt = t;
  ctx.save();
  const push = 1.07 - .07 * eInOut(seg(lt, 0, 3.6));
  ctx.translate(CX, 520); ctx.scale(push, push); ctx.translate(-CX, -520);
  // wall
  ctx.fillStyle = lin(0, 0, 0, H, ['#12c2b0', '#0aa39a', '#08867f']); ctx.fillRect(-200, -200, W + 400, H + 400);
  // tiles backsplash
  for (let y = 980; y < 1460; y += 80) for (let x = -80; x < W + 80; x += 80) {
    rr(x + 3, y + 3, 74, 74, 6); ctx.fillStyle = ((x / 80 + y / 80) % 2) ? '#f7f3e8' : '#fff9ee'; ctx.fill();
    ctx.save(); ctx.translate(x + 40, y + 40); ctx.rotate(Math.PI / 4); ctx.fillStyle = ((x / 80) % 2) ? '#e4177a' : '#0a6cb2'; ctx.fillRect(-9, -9, 18, 18); ctx.restore();
  }
  // window: the ghat at sunrise lives inside it
  const r = WIN1;
  inset(r, 0, () => scene2(t));
  ctx.lineWidth = 30; ctx.strokeStyle = '#f7f1e3'; ctx.strokeRect(r.x - 15, r.y - 15, r.w + 30, r.h + 30);
  ctx.lineWidth = 8; ctx.strokeStyle = '#c9b89a'; ctx.strokeRect(r.x - 30, r.y - 30, r.w + 60, r.h + 60);

  ctx.letterSpacing = '0px'; ctx.font = '46px Tiro'; ctx.fillStyle = '#ffd9a0'; ctx.fillText('छठ स्पेशल · त्योहार हो या चाय का वक़्त', CX, 1770);
  ctx.restore();
}

// ============================================================ RENDER
function render(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (t < 4.8) {
    ctx.save(); portalCam(t < 4.0 ? 0 : eInOut(seg(t, 4.0, 4.8)), WIN1); scene1(t); ctx.restore();
  } else if (t < 9.6) {
    scene2(t);
    if (t > 9.5) { ctx.save(); ctx.globalAlpha = seg(t, 9.5, 9.6); scene3(t); ctx.restore(); }
  } else if (t < 14.4) {
    ctx.save(); portalCam(t < 13.6 ? 0 : eInOut(seg(t, 13.6, 14.4)), PHONE_R); scene3(t); ctx.restore();
  } else if (t < 19.2) {
    scene4(t);
  } else {
    scene5(t);
  }
  heroOverlay(t);
  // captions
  scrim(1480, 1920, .55 * (1 - seg(t, 3.8, 4.3)));
  caption('कुछ स्वाद', null, 1600, .5, 4.1, t);
  caption('सिर्फ़ स्वाद नहीं होते…', 'some flavours are more than just flavours…', 1720, 1.3, 4.1, t, { size: 76, enSize: 42, gap: 80 });
  scrim(120, 520, .35 * seg(t, 6.4, 6.8) * (1 - seg(t, 8.8, 9.2)));
  caption('वो दुआ होते हैं,', "they're prayers,", 280, 6.6, 9.0, t);
  scrim(160, 560, .45 * seg(t, 10.9, 11.3) * (1 - seg(t, 13.4, 13.8)));
  caption('घर की याद होते हैं,', "they're home, when you're far away,", 320, 11.0, 13.6, t, { size: 96 });
  scrim(1560, 1920, .6 * seg(t, 15.2, 15.6) * (1 - seg(t, 18.2, 18.6)));
  caption('सबका साथ होते हैं…', "they're everyone, together…", 1700, 15.4, 18.5, t);
  scrim(120, 520, .45 * seg(t, 20.3, 20.7) * (1 - seg(t, 23.0, 23.4)));
  caption('हर घर में, हर त्योहार में', 'in every home, every festival, Dwarka', 280, 20.4, 23.4, t, { size: 88 });
  endCard(t);
  // grade: warm bloom, vignette, grain
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,150,80,.12)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rad(CX, CY, H * .35, H * .75, ['rgba(0,0,0,0)', 'rgba(10,0,20,.45)']); ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07; ctx.drawImage(A.grain, 0, 0, W, H);
  ctx.restore();
  const fade = Math.max(1 - seg(t, 0, .6), seg(t, 29.5, 30));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

async function init() {
  await Promise.all([
    document.fonts.load('100px Tiro', 'घर की मिठास'), document.fonts.load('italic 400 50px Fraunces', 'home'),
    document.fonts.load('600 80px Fraunces', 'Sri'), document.fonts.load('30px Kalam', 'माँ'), document.fonts.load('600 40px Poppins', 'ORDER'),
  ]);
  A.thekua = makeThekua();
  A.grain = makeGrain();
  window.READY = true;
}
window.frameJPEG = (t, q = .93) => { render(t); return cv.toDataURL('image/jpeg', q); };
init();
if (!/[?&]capture/.test(location.search)) {
  const t0 = performance.now();
  const loop = () => { if (window.READY) render(((performance.now() - t0) / 1000) % 30); requestAnimationFrame(loop); };
  loop();
}
</script>
